name: Build boon-data

on:
  workflow_dispatch:
    inputs:
      ref:
        description: GameTracking-Deadlock branch, tag, or commit
        default: master
        type: string
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: boon-data-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - name: Check Python quality
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked ty check
      - name: Test the pipeline
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Publish VData changes and update the version index
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref || 'master' }}
        run: uv run --locked python scripts/publish.py --ref "$SOURCE_REF" --vdata-only --publish
