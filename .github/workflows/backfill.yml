name: Backfill boon-data
run-name: Backfill boon-data from ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit SHA from SteamTracking/GameTracking-Deadlock
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boon-data-publish
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Validate the historical commit
        shell: bash
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Provide a full 40-character GameTracking-Deadlock commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked
      - name: Check Python quality
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked ty check
      - name: Test the pipeline
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Publish the historical snapshot and update the version index
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/publish.py --ref "$SOURCE_COMMIT" --publish
